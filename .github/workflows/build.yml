# TIOL — cross-platform release builds (Windows + macOS)
#
# Triggers:
#   - tag v*            : build + create DRAFT GitHub Release with all
#                         installers and portable zips (publish manually)
#   - manual dispatch   : build only (no release)
#   (Branch pushes do NOT build — releases only, C-11.11.)
#
# Notes:
#   - macOS artifacts are unsigned (no Apple signing secrets configured yet).
#     To enable signing/notarization, add the standard tauri-action secrets
#     (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID) and uncomment the signing
#     inputs below. See https://v2.tauri.app/distribute/sign/macos/
#   - ONNX Runtime: the Windows DLL is vendored in the repo; the macOS
#     universal2 dylib (CoreML EP, official Microsoft build) is downloaded
#     in CI. Both are copied next to the built binaries so the app can load
#     them at runtime (ort load-dynamic). Installers do NOT embed them yet —
#     the portable zips are the functional artifacts (see CHANGES.md C-11).
#   - icons: generated from app-icon.png via `npx tauri icon` (needs npm,
#     available on all runners; icon.icns is required for macOS bundling).

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Releases (draft creation + asset upload) need write access.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # macOS ONNX Runtime (arm64 — our .app is arm64-only; newer releases ship
  # per-arch instead of universal2). MUST be >= 1.17 (ort rc.13 ORT_API_VERSION
  # = 17 rejects older with BadVersion). Pinned 1.28.1: newer fixes the
  # LayerNorm-fusion crash on fp16 exports seen in 1.20.x/1.27 (C-11.14).
  ORT_MAC_VERSION: "1.28.1"
  ORT_MAC_URL: "https://github.com/microsoft/onnxruntime/releases/download/v1.28.1/onnxruntime-osx-arm64-1.28.1.tgz"
  # Fill in after one successful CI run (compute via `shasum -a 256 ort.tgz`
  # on any fast machine) — verification activates automatically when set.
  ORT_MAC_SHA256: ""

jobs:
  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    # tauri-action / softprops need the token explicitly (C-11.9).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate icons (icon.ico / icon.png)
        run: npx --yes @tauri-apps/cli icon app-icon.png --output src-tauri/icons

      - name: Install tauri CLI (npm)
        # tauri-action invokes `npm run tauri build` — the binary comes from
        # node_modules, which CI must install first (C-11.6).
        run: npm install

      - name: Build + bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        with:
          # Unsigned build; add secrets + signing inputs when distributing.
          args: --bundles msi,nsis
          # Release only on tag pushes (empty expressions otherwise -> build
          # only). Both jobs share the same tagName, so the two platforms
          # upload their assets into ONE release (C-11.8).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'TIOL v__VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      - name: Assemble portable folder (exe + onnxruntime.dll)
        shell: pwsh
        run: |
          # The raw cargo artifact is "tiol.exe" (lowercase); the bundle
          # renames it to TIOL.exe only inside installers. Pick whichever
          # exists (C-11.5).
          $exe = Get-ChildItem src-tauri/target/release/tiol.exe, src-tauri/target/release/TIOL.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "release exe not found" }
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item $exe.FullName portable/
          Copy-Item vendor/onnxruntime/win-x64/onnxruntime.dll portable/
          @"
          TIOL portable build — onnxruntime.dll included next to the exe.
          Data: %APPDATA%\com.tiol.desktop
          Models auto-download on first run (hf-mirror mirror chain).
          "@ | Set-Content portable\README.txt
          Compress-Archive -Path portable\* -DestinationPath TIOL-win64-portable.zip

      - name: Attach portable zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TIOL-win64-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiol-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            TIOL-win64-portable.zip
          if-no-files-found: warn

  build-macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    # tauri-action / softprops need the token explicitly (C-11.9).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Generate icons (icon.icns / icon.ico / icon.png)
        run: npx --yes @tauri-apps/cli icon app-icon.png --output src-tauri/icons

      - name: Install tauri CLI (npm)
        # tauri-action invokes `npm run tauri build` — the binary comes from
        # node_modules, which CI must install first (C-11.6).
        run: npm install

      - name: Download onnxruntime universal2 (CoreML EP)
        run: |
          mkdir -p vendor/onnxruntime/osx-universal2
          curl -L --fail -o ort.tgz "${{ env.ORT_MAC_URL }}"
          if [ -n "${{ env.ORT_MAC_SHA256 }}" ]; then
            echo "${{ env.ORT_MAC_SHA256 }}  ort.tgz" | shasum -a 256 -c -
          fi
          tar -xzf ort.tgz
          # The official macOS package ships "libonnxruntime.dylib".
          find . -name "libonnxruntime*.dylib" -exec cp {} vendor/onnxruntime/osx-universal2/libonnxruntime.dylib \;

      - name: Build + bundle (tauri-action)
        uses: tauri-apps/tauri-action@v0
        with:
          # Only the .app: a dmg built here would NOT contain the dylib we
          # embed afterwards (C-11.5). The .app is the portable artifact.
          args: --bundles app
          # Release only on tag pushes; shares the Windows job's release.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && 'TIOL v__VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      - name: Embed dylib into .app + zip portable
        run: |
          APP=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          test -f vendor/onnxruntime/osx-universal2/libonnxruntime.dylib \
            || { echo "::error::onnxruntime dylib missing after download"; exit 1; }
          cp vendor/onnxruntime/osx-universal2/libonnxruntime.dylib "$APP/Contents/MacOS/"
          test -f "$APP/Contents/MacOS/libonnxruntime.dylib" \
            || { echo "::error::dylib embed failed"; exit 1; }
          # Note: unsigned dylib + unsigned app — fine for local testing.
          codesign --force --deep --sign - "$APP" || echo "codesign skipped (no identity)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" TIOL-macos-arm64.zip

      - name: Attach portable zip to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: TIOL-macos-arm64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tiol-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            TIOL-macos-arm64.zip
          if-no-files-found: warn

  # ============================================================
  # 新增 Job：将构建产物推送到 TIOL-site 仓库并更新版本号
  # ============================================================
  push-to-site-repo:
    name: Push artifacts to TIOL-site releases/
    runs-on: ubuntu-latest
    # 只在 tag 推送时执行（与 release 逻辑一致）
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]   # 等待两个构建 job 完成
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tiol-windows
          path: ./artifacts/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: tiol-macos
          path: ./artifacts/macos

      - name: Checkout target repository (TIOL-site)
        uses: actions/checkout@v4
        with:
          repository: MNFilm-Industry/TIOL-site
          token: ${{ secrets.REPO_PUSH_TOKEN }}   # 需要提前配置该 Secret
          path: ./site-repo

      - name: Compute binary hashes and update version.json (update check, C-18)
        run: |
          cd ./site-repo
          VERSION=${GITHUB_REF_NAME#v}
          # Windows: SHA256 of tiol.exe inside the portable zip.
          WIN_SHA=$(unzip -p ../artifacts/windows/TIOL-win64-portable.zip tiol.exe 2>/dev/null | sha256sum | cut -d' ' -f1)
          # macOS: SHA256 of the .app executable (NOT the embedded dylib).
          # The .app is a DIRECTORY inside the uploaded artifact and keeps
          # its nested path (src-tauri/target/release/bundle/macos/*.app),
          # so find instead of a top-level glob (C-18.1).
          APP=$(find ../artifacts/macos -type d -name "*.app" 2>/dev/null | head -1)
          MAC_SHA=""
          if [ -n "$APP" ]; then
            EXE=$(find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name "*.dylib" 2>/dev/null | head -1)
            [ -n "$EXE" ] && MAC_SHA=$(sha256sum "$EXE" | cut -d' ' -f1)
          fi
          if [ -z "$WIN_SHA" ] && [ -z "$MAC_SHA" ]; then
            echo "::error::both platform hashes are empty — cannot publish version.json"
            exit 1
          fi
          cat > version.json <<EOF
          {
            "version": "$VERSION",
            "tag": "$GITHUB_REF_NAME",
            "updated": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "windows": { "sha256": "$WIN_SHA", "url": "https://tiol.netlify.app/releases/latest/TIOL-win64-portable.zip" },
              "macos": { "sha256": "$MAC_SHA", "url": "https://tiol.netlify.app/releases/latest/TIOL-macos-arm64.zip" }
            }
          }
          EOF
          cat version.json

      - name: Organize and copy artifacts into releases/ directory
        run: |
          # 创建版本子目录和 latest 目录
          VERSION=${GITHUB_REF_NAME#v}
          TARGET_DIR="./site-repo/releases/v${VERSION}"
          mkdir -p "$TARGET_DIR"
          mkdir -p "./site-repo/releases/latest"

          # 复制 Windows 产物（.msi, .exe, .zip）
          cp -v ./artifacts/windows/*.msi "$TARGET_DIR/" 2>/dev/null || true
          cp -v ./artifacts/windows/*.exe "$TARGET_DIR/" 2>/dev/null || true
          cp -v ./artifacts/windows/*.zip "$TARGET_DIR/" 2>/dev/null || true

          # 复制 macOS 产物（.app 目录和 .zip）
          cp -rv ./artifacts/macos/*.app "$TARGET_DIR/" 2>/dev/null || true
          cp -v ./artifacts/macos/*.zip "$TARGET_DIR/" 2>/dev/null || true

          # 同步到 latest 目录（便于官网固定链接）
          cp -v "$TARGET_DIR"/* ./site-repo/releases/latest/ 2>/dev/null || true

          # 打印目录结构（调试用）
          ls -lR ./site-repo/releases/

      - name: Commit and push to TIOL-site
        run: |
          cd ./site-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/ version.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update releases and version to ${GITHUB_REF_NAME}"
            git push
          fi
